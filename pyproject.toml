[project]
name = "anomalyscope"
version = "0.1.0"
description = "Industrial visual anomaly detection with PyTorch"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

[tool.mypy]
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
